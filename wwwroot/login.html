<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Sohbet Uygulaması</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2>Giriş Yap</h2>
            <p>Sohbete devam etmek için hesabınıza erişin.</p>
            
            <div class="input-group">
                <label>E-posta</label>
                <input type="email" id="login-email" placeholder="E-posta adresiniz">
            </div>
            
            <div class="input-group">
                <label>Şifre</label>
                <input type="password" id="login-password" placeholder="Şifreniz">
            </div>
            
            <button id="login-btn" class="auth-btn">Giriş Yap</button>
            <p class="auth-switch">Hesabınız yok mu? <a href="register.html">Kayıt Ol</a></p>
            <div id="login-error" class="error-msg"></div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
