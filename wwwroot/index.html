<!DOCTYPE html>
<html lang="tr">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohbet Uygulaması</title>
    
    <!-- DİKKAT: Tarayıcı önbelleğini zorla kırmak için sonuna '?v=2' ekledik -->
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        
        <!-- Sol Taraf: Sohbet Listesi -->
        <div class="sidebar">
            <div class="header">
                <!-- Profil Bilgileri -->
                <div class="user-profile-section" style="display: flex; align-items: center; gap: 12px;">
                    <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profil" class="profile-pic" id="my-profile-pic">
                    <div style="display: flex; flex-direction: column;">
                        <span id="current-user-name" style="font-weight: 600; color: #111b21; font-size: 15px;">Yükleniyor...</span>
                        <span id="current-user-email" style="color: #667781; font-size: 12px;">yükleniyor...</span>
                    </div>
                </div>
                
                <div class="header-icons">
                    <i class="fas fa-users" title="Kullanıcıları Listele"></i>
                    <i class="fas fa-cog" id="btn-ayarlar" title="TTS Ayarları"></i>
                    <i class="fas fa-sign-out-alt" id="logout-btn" title="Çıkış Yap" style="color: #e53935; cursor: pointer;"></i>
                </div>
            </div>
            
            <div class="search-bar">
                <div class="search-input">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Aratın veya yeni sohbet başlatın">
                </div>
            </div>
            
            <!-- Yeni Grup Butonu (Doğru Konumda) -->
            <div style="padding: 10px;">
                <button id="btn-yeni-grup" class="yeni-grup-btn" style="width: 100%; border-radius: 5px;">
                    <i class="fas fa-plus"></i> Yeni Grup Oluştur
                </button>
            </div>

            <!-- Sohbet Listesi Konteyneri (İçindeki sahte veriler silindi, JS dolduracak) -->
            <div class="chat-list" id="chat-list">
                <!-- Sohbetler buraya dinamik gelecek -->
            </div>
        </div>

        <!-- Sağ Taraf: Mesajlaşma Ekranı -->
        <div class="main-chat">
            <div class="header">
                <div class="chat-info">
                  <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Kullanıcı" class="profile-pic">
                    <div style="display: flex; flex-direction: column; justify-content: center;">
                         <h4 id="chat-header-title">Sohbet Seçin</h4>
        <!-- Alt kısımdaki katılımcı isimleri için yeni alan -->
                        <span id="chat-header-members" style="font-size: 12px; color: #667781; margin-top: 2px;"></span>
                    </div>
                </div>
                <div class="header-icons">
                    <i class="fas fa-search"></i>
                    <i class="fas fa-ellipsis-v"></i>
                </div>
            </div>

            <!-- Mesajlar Konteyneri (İçindeki sahte veriler silindi, JS dolduracak) -->
            <div class="messages-container" id="messages-container">
                <p style="text-align:center; color:#999; margin-top:50px;">Mesajlaşmaya başlamak için soldan bir sohbet seçin.</p>
            </div>

            <div class="input-area">
                <i class="far fa-smile"></i>
                <i class="fas fa-paperclip"></i>
                <input type="text" id="message-input" placeholder="Bir mesaj yazın">
                <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Profil Güncelleme Modalı -->
    <div id="profile-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-profile-modal">&times;</span>
            <h3 style="margin-bottom: 20px; color: #111b21;">Profil Bilgileri</h3>
            
            <div class="input-group">
                <label>Ad Soyad</label>
                <input type="text" id="update-name" placeholder="Adınız Soyadınız">
            </div>
            
            <div class="input-group">
                <label>E-posta</label>
                <input type="email" id="update-email" placeholder="E-posta adresiniz">
            </div>

            <button id="save-profile-btn" class="save-btn">Değişiklikleri Kaydet</button>
        </div>
    </div>

    <!-- Yeni Grup Modalı -->
    <div id="grup-modal" class="modal-gizli">
        <div class="modal-icerik">
            <span id="modal-kapat">&times;</span>
            <h3 style="margin-bottom: 10px; color: #111b21;">Yeni Grup Oluştur</h3>

            <div class="input-group">
                <label>Grup Adı:</label>
                <input type="text" id="yeni-grup-adi" placeholder="Örn: Blokzin Proje Ekibi">
            </div>

            <div class="input-group">
                <label>Kişi Ara:</label>
                <input type="text" id="kisi-ara" placeholder="İsim veya e-posta ara...">
            </div>

            <div id="kullanici-listesi" class="kullanici-listesi-container">
                <!-- JavaScript ile buraya diğer kullanıcılar liste olarak eklenecek -->
            </div>

            <button id="btn-grubu-kaydet" class="kaydet-btn" style="margin-top: 15px;">Grubu Oluştur</button>
        </div>
    </div>
    <!-- TTS Ayarları Modalı -->
<div id="ayarlar-modal" class="modal-gizli">
    <div class="modal-icerik" style="width: 450px;">
        <span id="ayarlar-modal-kapat" style="align-self: flex-end; cursor: pointer; font-size: 24px; font-weight: bold; color: #555;">&times;</span>
        <h3 style="margin-bottom: 15px; color: #111b21;">TTS ve İletişim Ayarları</h3>

        <div class="input-group">
            <label>Dil Seçimi:</label>
            <select id="tts-dil" style="padding: 10px; background-color: #f0f2f5; border: none; border-bottom: 2px solid #008069; outline: none; border-radius: 5px 5px 0 0; font-size: 15px;">
                <option value="tr-TR">Türkçe</option>
                <option value="en-US">İngilizce</option>
            </select>
        </div>

        <div class="input-group">
            <label>Ses Tipi (Google Standart):</label>
            <select id="tts-ses" style="padding: 10px; background-color: #f0f2f5; border: none; border-bottom: 2px solid #008069; outline: none; border-radius: 5px 5px 0 0; font-size: 15px;">
                <optgroup label="Türkçe Sesler">
                    <option value="tr-TR-Standard-A">Kadın 1 (TR)</option>
                    <option value="tr-TR-Standard-C">Kadın 2 (TR)</option>
                    <option value="tr-TR-Standard-B">Erkek 1 (TR)</option>
                    <option value="tr-TR-Standard-E">Erkek 2 (TR)</option>
                </optgroup>
                <optgroup label="İngilizce Sesler">
                    <option value="en-US-Standard-C">Kadın (EN)</option>
                    <option value="	en-US-Standard-A">Erkek (EN)</option>
                </optgroup>
            </select>
        </div>

        <div class="input-group">
            <label>Konuşma Hızı: <span id="hiz-gosterge">1.0</span>x</label>
            <input type="range" id="tts-hiz" min="0.5" max="2.0" step="0.1" value="1.0" style="accent-color: #008069; cursor: pointer;">
        </div>

        <div class="input-group" style="flex-direction: row; align-items: center; gap: 10px; margin-top: 10px;">
            <input type="checkbox" id="tts-otomatik" style="width: 20px; height: 20px; accent-color: #008069; cursor: pointer;">
            <label for="tts-otomatik" style="margin: 0; color: #111b21; font-weight: bold; cursor: pointer;">Mikrofon Arızası (Otomatik Oku)</label>
        </div>

        <button id="btn-ayarlari-kaydet" class="kaydet-btn" style="margin-top: 15px;">Ayarları Kaydet</button>
    </div>
</div>

    <!-- JS dosyasının sonuna da ?v=2 ekledik ki en güncel hali yüklensin -->
    <script src="app.js?v=2"></script>
</body>
</html>
