<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - Sohbet Uygulaması</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2>Kayıt Ol</h2>
            <p>Yeni bir hesap oluşturarak sohbete katılın.</p>
            
            <div class="input-group">
                <label>Ad Soyad</label>
                <input type="text" id="reg-name" placeholder="Adınız Soyadınız">
            </div>
            
            <div class="input-group">
                <label>E-posta</label>
                <input type="email" id="reg-email" placeholder="E-posta adresiniz">
            </div>
            
            <div class="input-group">
                <label>Şifre</label>
                <input type="password" id="reg-password" placeholder="Şifreniz">
            </div>
            
            <button id="register-btn" class="auth-btn">Kayıt Ol</button>
            <p class="auth-switch">Zaten hesabınız var mı? <a href="login.html">Giriş Yap</a></p>
            <div id="reg-error" class="error-msg"></div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
